<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Dhruvi Infinity Inspiration Ltd. social preview</title>
  <desc id="desc">DII parent brand preview with five live routes: Startup Business Builder, IFV Builder, Rotaplan, Warewise, and DII Accounts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.5" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#f2fff9"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#f8fbff"/>
  <circle cx="1010" cy="96" r="124" fill="#dbeafe" opacity="0.58" filter="url(#soft)"/>
  <circle cx="1008" cy="526" r="118" fill="#bbf7d0" opacity="0.52" filter="url(#soft)"/>
  <circle cx="720" cy="548" r="152" fill="#cffafe" opacity="0.48" filter="url(#soft)"/>

  <path d="M760 312c70-82 132-82 202 0 70 82 132 82 202 0" fill="none" stroke="url(#mark)" stroke-width="28" stroke-linecap="round" opacity="0.9"/>
  <path d="M760 312c70 82 132 82 202 0 70-82 132-82 202 0" fill="none" stroke="url(#mark)" stroke-width="28" stroke-linecap="round" opacity="0.48"/>
  <path d="M760 312c70-82 132-82 202 0 70 82 132 82 202 0" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.72"/>

  <rect x="64" y="58" width="744" height="514" rx="34" fill="#ffffff" opacity="0.92" filter="url(#shadow)"/>
  <rect x="64" y="58" width="744" height="514" rx="34" fill="none" stroke="#dbeafe" stroke-width="2"/>

  <text x="112" y="126" fill="#2563eb" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">DII.LTD</text>
  <text x="112" y="196" fill="#0f172a" font-family="DejaVu Sans, Arial, sans-serif" font-size="50" font-weight="800">Dhruvi Infinity</text>
  <text x="112" y="254" fill="#0f172a" font-family="DejaVu Sans, Arial, sans-serif" font-size="50" font-weight="800">Inspiration Ltd.</text>
  <text x="112" y="314" fill="#3f5168" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="500">Five live routes for founders, operations,</text>
  <text x="112" y="352" fill="#3f5168" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="500">and finance teams.</text>

  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">
    <rect x="112" y="396" width="306" height="52" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="136" y="430" fill="#1d4ed8">Startup Business Builder</text>

    <rect x="436" y="396" width="144" height="52" rx="12" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="460" y="430" fill="#0e7490">IFV Builder</text>

    <rect x="598" y="396" width="124" height="52" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="622" y="430" fill="#047857">Rotaplan</text>

    <rect x="112" y="466" width="146" height="52" rx="12" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="136" y="500" fill="#0369a1">Warewise</text>

    <rect x="276" y="466" width="178" height="52" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="300" y="500" fill="#334155">DII Accounts</text>
  </g>

  <g transform="translate(874 248)">
    <rect x="0" y="0" width="214" height="146" rx="24" fill="#ffffff" opacity="0.88" filter="url(#shadow)"/>
    <rect x="0" y="0" width="214" height="146" rx="24" fill="none" stroke="#dbeafe" stroke-width="2"/>
    <text x="36" y="90" fill="url(#mark)" font-family="DejaVu Sans, Arial, sans-serif" font-size="78" font-weight="800">DII</text>
  </g>
</svg>
